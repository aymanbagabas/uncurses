{{ if eq . "search" }}
<button class="icon-button search-trigger" type="button" data-search-open aria-label="Search documentation" title="Search documentation (/)" hidden>
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    <circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>
  </svg>
</button>
{{ else }}
<button class="icon-button theme-toggle" type="button" data-theme-toggle hidden>
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    <g data-theme-icon="system"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor" stroke="none"/></g>
    <g data-theme-icon="light" hidden><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></g>
    <path data-theme-icon="dark" hidden d="M20.9 13A9 9 0 1 1 11 3.1a7 7 0 0 0 9.9 9.9Z"/>
  </svg>
</button>
<span class="sr-only" role="status" data-theme-notice></span>
{{ end }}
