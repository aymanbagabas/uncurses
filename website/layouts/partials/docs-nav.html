<a class="docs-root" href="{{ "docs/" | relURL }}"{{ if eq .RelPermalink ("docs/" | relURL) }} aria-current="page"{{ end }}>Overview</a>
{{ $current := . }}
{{ with site.GetPage "/docs" }}
  {{ range .RegularPages.ByWeight }}
    <a class="docs-root" href="{{ .RelPermalink }}"{{ if eq $current.RelPermalink .RelPermalink }} aria-current="page"{{ end }}>{{ .Title }}</a>
  {{ end }}
  {{ range .Sections.ByWeight }}
    <div class="nav-group">
      <a class="nav-group-title" href="{{ .RelPermalink }}"{{ if eq $current.RelPermalink .RelPermalink }} aria-current="page"{{ end }}>{{ .Title }}</a>
      <details open>
        <summary aria-label="Toggle {{ .Title }}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
        </summary>
        <ul>
          {{ range .RegularPages.ByWeight }}
            <li><a href="{{ .RelPermalink }}"{{ if eq $current.RelPermalink .RelPermalink }} aria-current="page"{{ end }}>{{ .Title }}</a></li>
          {{ end }}
        </ul>
      </details>
    </div>
  {{ end }}
{{ end }}
<a class="nav-api" href="{{ "api/" | relURL }}">API reference</a>
<a class="nav-examples" href="https://github.com/aymanbagabas/uncurses/tree/main/examples/examples">Examples</a>
