baseURL = "https://aymanbagabas.github.io/uncurses/"
title = "uncurses"
enableRobotsTXT = true
enableGitInfo = true

# Tolerate cross-references to pages that may not exist yet (relref). Broken
# refs emit a build warning instead of failing the build.
refLinksErrorLevel = "warning"
refLinksNotFoundURL = "/404.html"

[module]
[[module.imports]]
path = "github.com/imfing/hextra"

[markup]
[markup.highlight]
noClasses = false
[markup.goldmark.renderer]
unsafe = true

[menu]
[[menu.main]]
name = "Docs"
pageRef = "/docs"
weight = 1
[[menu.main]]
name = "Examples"
pageRef = "/docs/examples"
weight = 2
[[menu.main]]
name = "API"
url = "api/"
weight = 3
[[menu.main]]
name = "Search"
weight = 4
[menu.main.params]
type = "search"
[[menu.main]]
name = "GitHub"
weight = 5
url = "https://github.com/aymanbagabas/uncurses"
[menu.main.params]
icon = "github"

[params]
[params.navbar]
displayTitle = true
displayLogo = false
[params.footer]
enable = true
displayCopyright = true
[params.editURL]
enable = true
base = "https://github.com/aymanbagabas/uncurses/edit/main/website/content"
