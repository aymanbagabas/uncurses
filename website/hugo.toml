baseURL = "https://uncurses.org/"
title = "uncurses"
enableRobotsTXT = true
enableGitInfo = true

# Tolerate cross-references to pages that may not exist yet (relref). Broken
# refs emit a build warning instead of failing the build.
refLinksErrorLevel = "warning"
refLinksNotFoundURL = "/404.html"

[outputs]
home = ["HTML", "RSS", "SearchIndex"]

[outputFormats.SearchIndex]
mediaType = "application/json"
baseName = "search"
isPlainText = true
notAlternative = true

[markup]
[markup.highlight]
noClasses = false
style = "monokai"
[markup.tableOfContents]
startLevel = 2
endLevel = 3
[markup.goldmark.renderer]
unsafe = true

[menu]
[[menu.main]]
name = "Manual"
pageRef = "/docs"
weight = 1
[[menu.main]]
name = "Examples"
url = "https://github.com/aymanbagabas/uncurses/tree/main/examples/examples"
weight = 2
[[menu.main]]
name = "API"
url = "/api/"
weight = 3
[[menu.main]]
name = "Source"
weight = 5
url = "https://github.com/aymanbagabas/uncurses"
