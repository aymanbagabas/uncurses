[package]
name = "uncurses"
description = "A Rust terminal rendering library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["terminal", "tui", "ansi", "console", "rendering"]
categories = ["command-line-interface", "rendering"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["unicode-rs"]
# Asynchronous event streaming. Adds `EventStream`, a `futures_core::Stream`
# of decoded events backed by a reader thread. Runtime-agnostic: depends
# only on `futures-core`, no executor or reactor.
async = ["dep:futures-core"]
# Pure-Rust Unicode tables. Small build, conservative coverage on
# emoji/ZWJ edge cases. Enabled by default.
unicode-rs = ["dep:unicode-segmentation", "dep:unicode-width"]
# ICU4X-backed segmentation and Unicode properties. Strictly more
# correct on emoji/property edge cases at the cost of a larger
# binary (segmentation/property tables are baked in). Takes
# precedence over `unicode-rs` when both are enabled.
icu = ["dep:icu_segmenter", "dep:icu_properties"]

[dependencies]
bitflags.workspace = true
compact_str.workspace = true
rustc-hash.workspace = true
futures-core = { workspace = true, optional = true }
unicode-segmentation = { workspace = true, optional = true }
unicode-width = { workspace = true, optional = true }
icu_segmenter = { workspace = true, optional = true }
icu_properties = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[lints.rust]
# Set by `RUSTFLAGS="--cfg uncurses_bench"` to compile the nightly-only
# renderer micro-benchmarks (see src/renderer/bench.rs). Declared here so
# stable builds don't warn about the unknown cfg.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(uncurses_bench)'] }
