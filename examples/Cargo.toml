[package]
name = "examples"
description = "Runnable examples for the uncurses terminal rendering library"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
uncurses = { path = "../uncurses" }
uncurses-image = { path = "../uncurses-image" }
uncurses-ratatui = { path = "../uncurses-ratatui" }
uncurses-textsize = { path = "../uncurses-textsize" }
ratatui = { version = "0.30", features = ["underline-color"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
