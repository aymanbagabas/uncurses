[package]
name = "uncurses-dragdrop"
description = "Event-driven Kitty drag and drop for uncurses"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["terminal", "tui", "kitty", "drag-and-drop"]
categories = ["command-line-interface"]

[features]
default = ["unicode-rs"]
unicode-rs = ["uncurses/unicode-rs"]
icu = ["uncurses/icu"]

[dependencies]
uncurses = { path = "../uncurses", version = "0.0.7", default-features = false }
base64 = "0.22"
bitflags.workspace = true
hmac = "0.12"
sha2 = "0.10"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6.1"
windows-sys = { workspace = true, features = ["Win32_System_Registry"] }
