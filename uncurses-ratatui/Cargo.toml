[package]
name = "uncurses-ratatui"
description = "Integration adapter for the uncurses terminal rendering library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["ratatui", "terminal", "tui", "backend", "ansi"]
categories = ["command-line-interface", "rendering"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["unicode-rs"]
unicode-rs = ["uncurses/unicode-rs"]
icu = ["uncurses/icu"]
# Asynchronous event streaming. Re-exports uncurses async so the screen's
# `events()` stream is available through the backend.
async = ["uncurses/async"]

[dependencies]
# Version must track workspace.package.version for crates.io publish
uncurses = { path = "../uncurses", version = "0.0.2", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["underline-color", "scrolling-regions"] }
unicode-width = "0.2"
