[workspace]
resolver = "3"
members = ["uncurses", "uncurses-ratatui", "examples"]

[workspace.package]
version = "0.0.2"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/aymanbagabas/uncurses"

[workspace.dependencies]
bitflags = "2"
compact_str = "0.8"
rustc-hash = "2"
unicode-segmentation = "1"
unicode-width = "0.2"
icu_segmenter = { version = "2", default-features = false, features = ["compiled_data"] }
icu_properties = { version = "2", default-features = false, features = ["compiled_data"] }
# 0.2.176 is the first release to derive `Debug` unconditionally rather than
# behind `extra_traits`. `terminal::State` exposes `libc::termios` and derives
# `Debug`, so anything older fails to compile.
libc = "0.2.176"
futures-core = "0.3"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Threading",
] }
