name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  # Tier-1 platforms with native runners: build and test across the width
  # backends. `default` exercises the pure-Rust backend; `all-features`
  # exercises the ICU backend plus async.
  test:
    name: test ${{ matrix.os }} (${{ matrix.features.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        features:
          - { name: default, flags: "" }
          - { name: all-features, flags: "--all-features" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked ${{ matrix.features.flags }}
      - run: cargo test --workspace --locked ${{ matrix.features.flags }}

  # musl libc on Linux. The crate is pure Rust, so a static musl binary
  # links without a C toolchain and runs on the glibc host.
  musl:
    name: test x86_64-unknown-linux-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked --all-features --target x86_64-unknown-linux-musl
      - run: cargo test --workspace --locked --all-features --target x86_64-unknown-linux-musl

  # The BSDs run inside QEMU VMs since GitHub does not host BSD runners.
  # They cover the platform-specific terminal backends (termios, the
  # pollers, signal handling, the async reader thread). The heavy
  # `examples` and `uncurses-ratatui` crates are skipped to keep the VMs
  # lean and off the ratatui dependency tree. (DragonFly is omitted: its
  # packaged Rust trails the crate's MSRV and it has no rustup channel.)
  freebsd:
    name: test freebsd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y rust
          run: |
            cargo build --workspace --exclude examples --exclude uncurses-ratatui --features async --locked
            cargo test --workspace --exclude examples --exclude uncurses-ratatui --features async --locked

  openbsd:
    name: test openbsd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg_add -I rust
          run: |
            cargo build --workspace --exclude examples --exclude uncurses-ratatui --features async --locked
            cargo test --workspace --exclude examples --exclude uncurses-ratatui --features async --locked

  netbsd:
    name: test netbsd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/netbsd-vm@v1
        with:
          usesh: true
          prepare: |
            /usr/sbin/pkg_add rust
          run: |
            export PATH="$PATH:/usr/pkg/bin"
            cargo build --workspace --exclude examples --exclude uncurses-ratatui --features async --locked
            cargo test --workspace --exclude examples --exclude uncurses-ratatui --features async --locked

  # illumos and Solaris have neither epoll nor kqueue, so they fall back
  # to the select poller. select(2) is required here rather than poll(2):
  # on these platforms poll(2) does not report readiness for tty
  # character devices, whereas select(2) does. Rust is installed via
  # rustup (illumos) and a community build script (Solaris) since the VMs
  # ship no Rust toolchain.
  illumos:
    name: test illumos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/omnios-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install gcc14 curl
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          run: |
            . "$HOME/.cargo/env"
            cargo build --workspace --exclude examples --exclude uncurses-ratatui --features async --locked
            cargo test --workspace --exclude examples --exclude uncurses-ratatui --features async --locked

  solaris:
    name: test solaris
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/solaris-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install gcc
            source <(curl -s https://raw.githubusercontent.com/psumbera/solaris-rust/refs/heads/main/sh.rust-web-install)
          run: |
            export PATH=$HOME/.rust_solaris/bin:$PATH
            cargo build --workspace --exclude examples --exclude uncurses-ratatui --features async --locked
            cargo test --workspace --exclude examples --exclude uncurses-ratatui --features async --locked
