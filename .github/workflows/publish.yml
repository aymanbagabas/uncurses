name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish crates and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      # --workspace verifies every crate before uploading any of them and
      # orders the uploads by the dependency graph. Publishing one at a time
      # can upload uncurses and then fail verifying uncurses-ratatui, and a
      # crates.io release cannot be taken back.
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --locked

      - name: Generate release notes
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip header

      # Intro first, then the generated changelog folded away — the full list is
      # long enough to bury the description of what the thing actually is.
      - name: Assemble release notes
        env:
          CHANGELOG: ${{ steps.cliff.outputs.changelog }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            cat <<EOF
          **uncurses** is a Rust library for building terminal user interfaces. It gives you a direct, framework-free way to draw to the terminal and read input — you own every cell and your own event loop, whether you run inline, take over the full screen, or mix the two.

          A diffing renderer that redraws only what changed, Unicode-aware width, truecolor styling with automatic downsampling, hyperlinks, and typed keyboard, mouse, and paste input. It asks the terminal what it supports instead of looking it up in a terminfo database, so the same code runs on Linux, macOS, and Windows.

          \`\`\`toml
          [dependencies]
          uncurses = "$version"
          \`\`\`

          Using [ratatui](https://ratatui.rs)? \`uncurses-ratatui\` provides a backend.

          Guides, concepts, and API reference: **[uncurses.org](https://uncurses.org)**

          <details>
          <summary><b>Changelog</b></summary>

          EOF
            cat "$CHANGELOG"
            printf '\n\n</details>\n'
          } > release-notes.md

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
